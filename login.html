<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxture | Login</title>
    <!-- Use base fonts and icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="glass-auth-body">

    <!-- Background Animated Shapes for Glassmorphism Effect -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Centered Glassmorphism Card -->
    <div class="glass-login-card">

        <div class="card-header">
            <a href="index.html" class="brand-logo">Vox<span>ture</span></a>
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in.</p>
        </div>

        <!-- Error Message Container (Hidden by default) -->
        <div id="auth-error-msg" class="error-toast" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text">Invalid email or password. Please try again.</span>
        </div>

        <form id="centered-login-form" class="glass-form">

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required
                        autocomplete="current-password">
                    <button type="button" class="pwd-toggle" id="toggle-pwd" aria-label="Toggle password visibility">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="remember-me">
                    <span class="checkmark"></span>
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Animated interactive button -->
            <button type="submit" class="btn-animated-login" id="submit-btn">
                <span class="btn-text">Sign In</span>
                <i class="fas fa-arrow-right btn-icon"></i>
                <div class="spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
            </button>

        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="social-auth">
            <button class="social-btn glass-btn" type="button">
                <i class="fab fa-google" style="color: #DB4437;"></i> Google
            </button>
        </div>

        <p class="auth-footer">
            Don't have an account? <a href="signup.html">Sign up here</a>
        </p>

    </div>

    <script src="auth.js"></script>
</body>

</html>
