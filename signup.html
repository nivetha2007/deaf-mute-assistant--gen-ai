<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxture | Create Account</title>
    <!-- Use base fonts and icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="glass-auth-body">

    <!-- Background Animated Shapes for Glassmorphism Effect -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Centered Glassmorphism Card -->
    <div class="glass-login-card signup-card">

        <div class="card-header">
            <a href="index.html" class="brand-logo">Vox<span>ture</span></a>
            <h2>Create an Account</h2>
            <p>Join us to unlock accessible AI communication tools.</p>
        </div>

        <!-- Error Message Container -->
        <div id="auth-error-msg" class="error-toast" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text">Passwords do not match.</span>
        </div>

        <form id="centered-signup-form" class="glass-form animated-form">

            <div class="input-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <i class="far fa-user input-icon"></i>
                    <input type="text" id="name" placeholder="John Doe" required autocomplete="name">
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Create a strong password" required minlength="8">
                    <button type="button" class="pwd-toggle" id="toggle-pwd" aria-label="Toggle password visibility">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <!-- Password Strength Indicator -->
                <div class="pwd-strength-meter">
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <span id="strength-text" class="strength-text">Weak</span>
                </div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle input-icon"></i>
                    <input type="password" id="confirm-password" placeholder="Repeat password" required minlength="8">
                    <button type="button" class="pwd-toggle" id="toggle-confirm-pwd"
                        aria-label="Toggle password visibility">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-container terms-check">
                    <input type="checkbox" id="terms-agree" required>
                    <span class="checkmark"></span>
                    <span>I agree to the <a href="#" class="forgot-link">Terms & Conditions</a></span>
                </label>
            </div>

            <!-- Animated interactive button -->
            <button type="submit" class="btn-animated-login" id="submit-btn">
                <span class="btn-text">Sign Up</span>
                <i class="fas fa-user-plus btn-icon"></i>
                <div class="spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
            </button>

        </form>

        <p class="auth-footer" style="margin-top: 1.5rem;">
            Already have an account? <a href="login.html">Sign in here</a>
        </p>

    </div>

    <!-- Include unified auth JS logic -->
    <script src="auth.js"></script>
</body>

</html>
